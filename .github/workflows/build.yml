
name: Build Frotta Clone APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FrottaClone.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q FrottaClone.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts | head -1)
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frotta-Clone-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
