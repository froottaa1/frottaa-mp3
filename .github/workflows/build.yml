name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip FrottaMP3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: FrottaMP3
      - run: gradle assembleRelease --no-daemon
        working-directory: FrottaMP3
      - uses: actions/upload-artifact@v4
        with:
          name: Frotta-MP3-APK
          path: FrottaMP3/app/build/outputs/apk/release/*.apk
